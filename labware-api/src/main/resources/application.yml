labware:
  stt:
    url: ${STT_SERVICE_URL:http://localhost:8000}
    timeout-segundos: ${STT_TIMEOUT_SEGUNDOS:120}
  uploads:
    diretorio: ${UPLOADS_DIRETORIO:./uploads/chamados}
    tamanho-maximo-bytes: 10485760
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: 120
  cors:
    origens: http://localhost:5173

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: labware-api
  datasource:
    url: jdbc:postgresql://localhost:5432/labware
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.3

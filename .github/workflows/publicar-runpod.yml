name: Publicar imagem do Cobyte para RunPod

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-runpod
  cancel-in-progress: false

jobs:
  publicar:
    name: Construir e publicar imagem
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Conferir configuracao do Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo '::error::Cadastre a variavel DOCKERHUB_USERNAME com seu usuario do Docker Hub.'
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Cadastre o secret DOCKERHUB_TOKEN com permissao de escrita.'
            exit 1
          fi

      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar API, Ollama e STT
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/cobyte-runpod:1
            ${{ vars.DOCKERHUB_USERNAME }}/cobyte-runpod:${{ github.sha }}

      - name: Registrar imagem publicada
        run: |
          echo '### Imagem publicada para RunPod' >> "$GITHUB_STEP_SUMMARY"
          echo "Container image: \`$DOCKERHUB_USERNAME/cobyte-runpod:1\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'A imagem ainda precisa ser validada em um Pod com GPU.' >> "$GITHUB_STEP_SUMMARY"
